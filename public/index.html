<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greenair BACnet Explorer Web</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#dfe4e9;--text:#1f2a33;--muted:#65727e;--green:#20a464;--red:#d44545;--blue:#1769aa;--amber:#ba8500;--nav:#1d2a35}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}header{height:60px;background:#0f1b24;color:#fff;display:flex;align-items:center;padding:0 22px;gap:16px}.brand{font-size:20px;font-weight:700}.ver{font-size:12px;color:#aac0d1}main{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 60px)}aside{background:var(--nav);color:#d9e1e8;padding:16px}.navbtn{display:block;width:100%;border:0;text-align:left;background:transparent;color:inherit;padding:10px 12px;border-radius:8px;margin:2px 0;font-size:14px;cursor:pointer}.navbtn:hover,.navbtn.active{background:#314252}.transport{margin-top:20px;padding:12px;border:1px solid #40515f;border-radius:8px;font-size:12px;line-height:1.55}.content{padding:22px;max-width:1500px;width:100%}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#eef2f6;color:#263442;border:1px solid #d5dde6}.btn.danger{background:#b73d3d}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.status{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.online .dot{background:var(--green)}.offline .dot{background:var(--red)}.meta{color:var(--muted);font-size:13px;line-height:1.6}.points{width:100%;border-collapse:collapse;margin-top:12px}.points th,.points td{padding:9px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:middle}.points th{font-size:11px;color:var(--muted);text-transform:uppercase}.value{font-variant-numeric:tabular-nums;font-weight:700}.error{color:var(--red)}.warn{color:var(--amber)}.hero{background:linear-gradient(135deg,#fff,#edf7f1)}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:var(--muted)}.log,textarea.code{font-family:Consolas,monospace;background:#111923;color:#dce8f5;border-radius:8px;padding:12px;white-space:pre-wrap;min-height:100px;font-size:12px;margin-top:10px;width:100%;border:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pill{padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px}.notice{background:#fff6dc;border:1px solid #ead393;padding:10px 12px;border-radius:8px;color:#6d5200;font-size:13px;margin:10px 0}.oknotice{background:#e9f7ef;border:1px solid #a8dfbd;color:#196438}.input{padding:9px;border:1px solid #cfd7de;border-radius:6px;background:#fff}.small{width:95px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tab{padding:7px 10px;border:1px solid #d8dfe5;border-radius:6px;background:#fff;cursor:pointer}.tab.active{background:#263b4c;color:white}.nowrap{white-space:nowrap}@media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}.grid,.split{grid-template-columns:1fr}.content{padding:12px}}</style></head><body>
<header><div class="brand">Greenair BACnet Explorer Web</div><div class="ver">v0.6.1 FULL · Render / Modbus TCP</div></header><main><aside>
<button class="navbtn active" data-view="overview">Overview</button><button class="navbtn" data-view="planksInputs">Planks Inputs</button><button class="navbtn" data-view="tbeamsInputs">T-Beams Inputs</button><button class="navbtn" data-view="planksOutputs">Planks Actual Outputs</button><button class="navbtn" data-view="manualOverrides">Manual Overrides</button><button class="navbtn" data-view="variables">Variables</button><button class="navbtn" data-view="pids">PIDs</button><button class="navbtn" data-view="schedules">Schedules</button><button class="navbtn" data-view="programs">Programs</button><button class="navbtn" data-view="descriptors">Descriptors</button><button class="navbtn" data-view="raw">Raw Register Reader</button><button class="navbtn" data-view="diagnostics">Diagnostics</button><button class="navbtn" data-view="trends">Trend Logs</button><button class="navbtn" data-view="settings">Settings</button>
<div class="transport"><b>Live transport</b><br>Planks: 502 / Unit 69<br>T-Beams: 505 / Unit 68<br><br><span id="writeState">Checking write lock…</span></div></aside><section class="content" id="app"></section></main>
<script>
const app=document.getElementById('app');let timer=null,statusCache=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,{cache:'no-store',...(opt||{})});let j;try{j=await r.json()}catch{j={error:await r.text()}}if(!r.ok)throw new Error(j.error||r.statusText);return j}function badge(o){return `<span class="status ${o?'online':'offline'}"><span class="dot"></span>${o?'ONLINE':'OFFLINE'}</span>`}function stop(){if(timer){clearInterval(timer);timer=null}}
async function getStatus(){statusCache=await api('/api/status');document.getElementById('writeState').innerHTML=statusCache.writesEnabled?'<b style="color:#ffcf5c">WRITES ENABLED</b>':'Writes locked by server';return statusCache}
function descKey(sys,cat,id){return `ga_desc_${sys}_${cat}_${id}`}function descriptor(sys,cat,p){return localStorage.getItem(descKey(sys,cat,p.id))||p.name}
async function overview(){stop();const s=await getStatus();app.innerHTML=`<div class="card hero"><h1>Bianco Controller Explorer</h1><p>Full web explorer build using the proven Render → Modbus TCP connection.</p><div class="toolbar" style="margin-top:14px"><button class="btn" id="connect">Connect Controllers</button><button class="btn secondary" id="openPrograms">Open Programs</button><button class="btn secondary" onclick="window.print()">Print / PDF</button></div><div id="result" class="log">Ready.</div></div><div class="grid" id="cards"></div><div class="card" style="margin-top:16px"><b>Build status</b><div class="meta">Inputs, control registers, variables, raw register tools, descriptors, PID/schedule workspaces, program decoder workspace and diagnostics are included. Full Bravo token decoding still depends on the exact program memory/token map.</div></div>`;connect.onclick=connect;openPrograms.onclick=()=>{document.querySelector('[data-view=programs]').click()};await connect()}
async function connect(){const out=document.getElementById('result'),cards=document.getElementById('cards');if(!out)return;out.textContent='Testing controllers...';try{const d=await api('/api/connect');out.textContent=JSON.stringify(d,null,2);cards.innerHTML=d.results.map(r=>`<div class="card"><h3>${esc(r.name)}</h3>${badge(r.online)}<div class="meta" style="margin-top:8px">${esc(r.host)}:${r.port}<br>Unit ${r.unitId}<br>${r.online?`Sample: ${esc(r.sample.name)} = ${Number(r.sample.value).toFixed(3)} ${esc(r.sample.units)}`:esc(r.error)}</div></div>`).join('')}catch(e){out.textContent='ERROR: '+e.message}}
async function categoryView(id,category,title){stop();await getStatus();app.innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">${esc(title)}</h2><span class="pill">3-second refresh</span><button class="btn secondary" id="reload">Refresh</button><button class="btn secondary" onclick="window.print()">Print / PDF</button></div>${category==='outputs'?`<div class="notice">Writes are ${statusCache.writesEnabled?'<b>enabled</b>. Every write uses a strict allow-list and read-back verification.':'<b>locked</b> on the server. Reading remains live.'}</div>`:''}<div id="sys"></div>`;reload.onclick=()=>loadCategory(id,category);await loadCategory(id,category);timer=setInterval(()=>loadCategory(id,category),3000)}
async function writePoint(sys,pid,current,min,max){const raw=prompt(`Write ${pid}\nAllowed: ${min} to ${max}\nCurrent: ${current}`,String(current));if(raw===null)return;const v=Number(raw);if(!Number.isInteger(v)){alert('Enter a whole number.');return}if(!confirm(`Write ${v} to ${pid}?\n\nThe server will verify the controller read-back.`))return;try{const d=await api(`/api/system/${sys}/write`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pointId:pid,value:v})});alert(`Write verified.\nBefore: ${d.before}\nAfter: ${d.readBack}`);loadCategory(sys,'overrides')}catch(e){alert('WRITE FAILED: '+e.message)}}
async function loadCategory(id,category){const el=document.getElementById('sys');if(!el)return;try{const d=await api(`/api/system/${id}/${category}`);el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><h3 style="margin-top:0">${esc(d.name)}</h3><div class="meta">${esc(d.host)}:${d.port} · Unit ${d.unitId}<br>Read ${d.okCount}/${d.pointCount} points in ${d.elapsedMs} ms</div></div>${badge(d.online)}</div>${d.pointCount?`<table class="points"><thead><tr><th>Descriptor</th><th>Register(s)</th><th>Value</th><th>Notes</th>${category==='outputs'?'<th>Control</th>':''}<th>Status</th></tr></thead><tbody>${d.points.map(p=>`<tr><td>${esc(descriptor(id,category,p))}<div class="meta">${esc(p.name)}</div></td><td>${p.highRegister!==undefined?`${p.highRegister}/${p.register}`:p.register}</td><td class="value">${p.ok?`${Number(p.value).toFixed(p.kind==='signed32Analog'?3:0)} ${esc(p.units||'')}`:'—'}</td><td class="meta">${esc(p.note||'')}</td>${category==='outputs'?`<td>${p.writable?`<button class="btn secondary" ${statusCache&&!statusCache.writesEnabled?'disabled':''} onclick="writePoint('${id}','${p.id}',${Number(p.value||0)},${p.min},${p.max})">Write</button>`:'Read only'}</td>`:''}<td>${p.ok?'OK':`<span class="error">${esc(p.error)}</span>`}</td></tr>`).join('')}</tbody></table>`:'<p class="meta">No verified points mapped yet.</p>'}</div>`}catch(e){el.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}

async function manualOverridesView(){stop();await getStatus();app.innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">Manual Overrides</h2><span class="pill">Commands, not actual outputs</span></div><div class="notice">These are the override command registers from the working TrendLog. They are deliberately separated from actual output-state registers. Writes are ${statusCache&&statusCache.writesEnabled?'<b>enabled</b>':'<b>locked</b>'}.</div><div id="plov"></div><div id="tbov" style="margin-top:14px"></div>`;for(const [id,target] of [['planks','plov'],['tbeams','tbov']]){try{const d=await api(`/api/system/${id}/overrides`);document.getElementById(target).innerHTML=`<div class="card"><h3>${esc(d.name)}</h3><table class="points"><thead><tr><th>Command</th><th>Register</th><th>Value</th><th>Control</th><th>Status</th></tr></thead><tbody>${d.points.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.register}</td><td class="value">${p.ok?Number(p.value).toFixed(0):'—'} ${esc(p.units||'')}</td><td>${p.writable?`<button class="btn secondary" ${statusCache&&!statusCache.writesEnabled?'disabled':''} onclick="writePoint('${id}','${p.id}',${Number(p.value||0)},${p.min},${p.max})">Write</button>`:'Read only'}</td><td>${p.ok?'OK':`<span class="error">${esc(p.error)}</span>`}</td></tr>`).join('')}</tbody></table></div>`}catch(e){document.getElementById(target).innerHTML=`<div class="card error">${esc(e.message)}</div>`}}}}
function variablesView(){stop();app.innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">Variables</h2><span class="pill">3-second refresh</span></div><div class="grid"><div id="pv"></div><div id="tv"></div></div>`;const f=()=>{loadVars('planks','pv');loadVars('tbeams','tv')};f();timer=setInterval(f,3000)}async function loadVars(id,t){const el=document.getElementById(t);try{const d=await api(`/api/system/${id}/variables`);el.innerHTML=`<div class="card"><h3>${esc(d.name)}</h3>${d.points.length?d.points.map(p=>`<p><b>${esc(descriptor(id,'variables',p))}</b>: ${p.ok?esc(p.value):'—'} <span class="meta">reg ${p.register} ${esc(p.note||'')}</span></p>`).join(''):'<p class="meta">No verified variable map loaded yet. Use Raw Register Reader to investigate safely.</p>'}</div>`}catch(e){el.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function workspace(title,key,defaults,note){stop();const s=JSON.parse(localStorage.getItem(key)||JSON.stringify(defaults));app.innerHTML=`<div class="card"><h2>${esc(title)}</h2><div class="notice">${esc(note)}</div><div class="toolbar"><select class="input" id="wsSys"><option value="planks">Planks</option><option value="tbeams">T-Beams</option></select><label>Start <input class="input small" id="wsReg" type="number" value="${s.register}"></label><label>Qty <input class="input small" id="wsQty" type="number" min="1" max="125" value="${s.quantity}"></label><button class="btn" id="wsRead">Read block</button><button class="btn secondary" id="wsSave">Save profile</button></div><div class="log" id="wsOut">Ready.</div></div>`;wsSys.value=s.system||'planks';wsSave.onclick=()=>{localStorage.setItem(key,JSON.stringify({system:wsSys.value,register:Number(wsReg.value),quantity:Number(wsQty.value)}));wsOut.textContent='Profile saved in this browser.'};wsRead.onclick=async()=>{wsOut.textContent='Reading...';try{wsOut.textContent=JSON.stringify(await api(`/api/raw/${wsSys.value}?register=${wsReg.value}&quantity=${wsQty.value}`),null,2)}catch(e){wsOut.textContent='ERROR: '+e.message}}}
function pidsView(){workspace('PIDs','ga_pid_profile',{system:'planks',register:0,quantity:16},'PID register mapping is controller-specific. This workspace lets us inspect and save candidate register blocks without writing anything. Once verified, we can promote those registers into named PID fields.')}
function schedulesView(){workspace('Schedules','ga_sched_profile',{system:'planks',register:0,quantity:32},'Schedule memory/register mapping has not yet been verified on this Bravo. This is a safe read-only workspace for locating the schedule block.')}
function programsView(){stop();app.innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin-right:auto">Programs</h2><span class="pill">LIVE WORKSPACE</span></div><div class="notice">Programs workspace is active in v0.6.1. Program writes remain disabled. Use the controller block reader for candidate ranges, or paste raw bytes from the Windows tool. Raw bytes are always preserved.</div><div class="split"><div><h3>Controller register block</h3><div class="toolbar"><select class="input" id="pSys"><option value="planks">Planks</option><option value="tbeams">T-Beams</option></select><input class="input small" id="pReg" type="number" value="0" title="start register"><input class="input small" id="pQty" type="number" min="1" max="125" value="32"><button class="btn secondary" id="pRead">Read</button></div><h3>Raw program hex</h3><textarea id="hex" class="code" rows="15" placeholder="Paste raw program bytes, e.g. 1A 02 01 0A ..."></textarea><button class="btn" id="decode">Decode / Inspect</button></div><div><h3>Decoded preview</h3><div class="log" id="decoded">Ready.</div><h3>Hex dump</h3><div class="log" id="dump"></div></div></div></div>`;pRead.onclick=async()=>{try{const d=await api(`/api/raw/${pSys.value}?register=${pReg.value}&quantity=${pQty.value}`);hex.value=d.registers.map(v=>v.toString(16).padStart(4,'0')).join(' ');decoded.textContent='Register block loaded. Press Decode / Inspect.'}catch(e){decoded.textContent='ERROR: '+e.message}};decode.onclick=async()=>{decoded.textContent='Decoding...';try{const d=await api('/api/program/decode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hex:hex.value})});decoded.textContent=(d.preview||'(no printable strings found)')+'\n\n'+d.note+'\n\nBytes: '+d.byteLength;dump.textContent=d.hexDump}catch(e){decoded.textContent='ERROR: '+e.message}}}
async function descriptorsView(){stop();const blocks=[];for(const sys of ['planks','tbeams'])for(const cat of ['inputs','outputs','variables']){try{const d=await api(`/api/system/${sys}/${cat}`);blocks.push({sys,cat,d})}catch{}}app.innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">Descriptors</h2><button class="btn secondary" id="exp">Export JSON</button><button class="btn danger" id="clear">Clear overrides</button></div><div class="notice">Descriptor overrides are stored in this browser only. They do not write to the Bravo controller.</div>${blocks.map(b=>`<div class="card" style="margin-top:12px"><h3>${esc(b.d.name)} · ${esc(b.cat)}</h3>${b.d.points.length?b.d.points.map(p=>`<div class="toolbar" style="margin:6px 0"><span style="width:180px" class="meta">${esc(p.name)}</span><input class="input" style="min-width:280px" value="${esc(descriptor(b.sys,b.cat,p))}" data-k="${descKey(b.sys,b.cat,p.id)}"></div>`).join(''):'<span class="meta">No mapped points.</span>'}</div>`).join('')}`;document.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>localStorage.setItem(i.dataset.k,i.value));clear.onclick=()=>{if(confirm('Clear all descriptor overrides in this browser?')){Object.keys(localStorage).filter(k=>k.startsWith('ga_desc_')).forEach(k=>localStorage.removeItem(k));descriptorsView()}};exp.onclick=()=>{const o={};Object.keys(localStorage).filter(k=>k.startsWith('ga_desc_')).forEach(k=>o[k]=localStorage.getItem(k));const blob=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Greenair_descriptors.json';a.click();URL.revokeObjectURL(a.href)}}
function rawView(){stop();app.innerHTML=`<div class="card"><h2>Raw Register Reader</h2><p class="meta">Direct FC03 holding-register read through Render. Up to 125 registers.</p><div class="toolbar"><select class="input" id="system"><option value="planks">Planks</option><option value="tbeams">T-Beams</option></select><input class="input" id="reg" type="number" value="7484" min="0" max="65535"><input class="input small" id="qty" type="number" value="2" min="1" max="125"><button class="btn" id="read">Read</button></div><div class="log" id="rawout">Ready.</div></div>`;read.onclick=async()=>{rawout.textContent='Reading...';try{rawout.textContent=JSON.stringify(await api(`/api/raw/${system.value}?register=${reg.value}&quantity=${qty.value}`),null,2)}catch(e){rawout.textContent='ERROR: '+e.message}}}
async function diagnosticsView(){stop();const s=await getStatus();app.innerHTML=`<div class="card"><h2>Diagnostics</h2><div class="toolbar"><button class="btn" id="dConnect">Connection test</button><button class="btn secondary" id="dStatus">Server status</button></div><div class="log" id="diag">${esc(JSON.stringify(s,null,2))}</div></div>`;dConnect.onclick=async()=>diag.textContent=JSON.stringify(await api('/api/connect'),null,2);dStatus.onclick=async()=>diag.textContent=JSON.stringify(await getStatus(),null,2)}
function trendsView(){stop();app.innerHTML=`<div class="card"><h2>Trend Logs</h2><p>The existing Greenair TrendLog remains the production history system and is intentionally left untouched.</p><a class="btn" style="display:inline-block;text-decoration:none" href="https://greenair-trendlog.onrender.com/" target="_blank" rel="noopener">Open Greenair TrendLog</a></div>`}
async function settingsView(){stop();const s=await getStatus();app.innerHTML=`<div class="card"><h2>Settings</h2><table class="points"><tbody><tr><th>Version</th><td>${esc(s.version)}</td></tr><tr><th>Transport</th><td>${esc(s.transport)}</td></tr><tr><th>Writes</th><td>${s.writesEnabled?'<b class="warn">ENABLED</b>':'LOCKED'}</td></tr>${s.systems.map(x=>`<tr><th>${esc(x.name)}</th><td>${esc(x.host)}:${x.port} · Unit ${x.unitId}</td></tr>`).join('')}</tbody></table><div class="notice">To enable the verified control writes later, add Render environment variable <b>ENABLE_WRITES=true</b>. The server still limits writes to the known allow-list and verifies every read-back.</div></div>`}
const views={overview,planksInputs:()=>categoryView('planks','inputs','Planks Inputs'),tbeamsInputs:()=>categoryView('tbeams','inputs','T-Beams Inputs'),planksOutputs:()=>categoryView('planks','outputs','Planks Actual Outputs'),manualOverrides:manualOverridesView,variables:variablesView,pids:pidsView,schedules:schedulesView,programs:programsView,descriptors:descriptorsView,raw:rawView,diagnostics:diagnosticsView,trends:trendsView,settings:settingsView};document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');views[b.dataset.view]()});overview();
</script></body></html>
