<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greenair BACnet Explorer Web</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#18212b;--muted:#66717e;--line:#dde3ea;--green:#159447;--red:#c8392b;--nav:#16212b;--blue:#1976d2;--amber:#b87900}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{height:64px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 22px;gap:14px}header .brand{font-size:21px;font-weight:700}header .ver{opacity:.65;font-size:13px}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 64px)}aside{background:#1e2a36;color:#d9e1e8;padding:18px}.navbtn{display:block;width:100%;border:0;text-align:left;background:transparent;color:inherit;padding:11px 14px;border-radius:8px;margin:2px 0;font-size:14px;cursor:pointer}.navbtn:hover,.navbtn.active{background:#2d3d4d}.transport{margin-top:25px;padding:12px;border:1px solid #3b4b5a;border-radius:8px;font-size:12px;line-height:1.5}.content{padding:24px;max-width:1400px;width:100%}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:10px 15px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#eef2f6;color:#263442;border:1px solid #d5dde6}.grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:16px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.status{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#a2aab2}.online .dot{background:var(--green)}.offline .dot{background:var(--red)}.meta{color:var(--muted);font-size:13px;line-height:1.7}.points{width:100%;border-collapse:collapse;margin-top:12px}.points th,.points td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}.points th{font-size:12px;color:var(--muted);text-transform:uppercase}.value{font-variant-numeric:tabular-nums;font-weight:700}.error{color:var(--red);font-size:12px}.warn{color:var(--amber);font-size:12px}.hero{background:linear-gradient(135deg,#fff,#f0f7f3)}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:var(--muted)}.log,textarea.code{font-family:Consolas,monospace;background:#111923;color:#dce8f5;border-radius:8px;padding:12px;white-space:pre-wrap;min-height:110px;font-size:12px;margin-top:12px;width:100%;border:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pill{padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px}.lock{background:#fff6dc;border:1px solid #ead393;padding:10px 12px;border-radius:8px;color:#6d5200;font-size:13px;margin:12px 0}@media(max-width:850px){main{grid-template-columns:1fr}aside{display:none}.grid,.split{grid-template-columns:1fr}.content{padding:14px}}
</style></head><body>
<header><div class="brand">Greenair BACnet Explorer Web</div><div class="ver">v0.5.0 · Render / Modbus TCP</div></header><main><aside>
<button class="navbtn active" data-view="overview">Overview</button>
<button class="navbtn" data-view="planksInputs">Planks Inputs</button><button class="navbtn" data-view="tbeamsInputs">T-Beams Inputs</button>
<button class="navbtn" data-view="planksOutputs">Planks Outputs / Controls</button><button class="navbtn" data-view="tbeamsOutputs">T-Beams Outputs / Controls</button>
<button class="navbtn" data-view="variables">Variables</button><button class="navbtn" data-view="raw">Raw Register Reader</button><button class="navbtn" data-view="programs">Programs</button>
<div class="transport"><b>Transport</b><br>Bianco via proven Modbus TCP.<br><br>Planks: 502 / Unit 69<br>T-Beams: 505 / Unit 68<br><br><b>Writes locked</b> in v0.5.0.</div></aside><section class="content" id="app"></section></main>
<script>
const app=document.getElementById('app');let timer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,{cache:'no-store',...(opt||{})});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}function badge(o){return `<span class="status ${o?'online':'offline'}"><span class="dot"></span>${o?'ONLINE':'OFFLINE'}</span>`}
async function overview(){clearInterval(timer);app.innerHTML=`<div class="card hero"><h1>Bianco Controller Explorer</h1><p>Working Render connection preserved. v0.5.0 expands the explorer while keeping all writes locked.</p><div class="toolbar" style="margin-top:16px"><button class="btn" id="connect">Connect Bianco Controllers</button></div><div id="result" class="log">Ready.</div></div><div class="grid" id="cards"></div>`;document.getElementById('connect').onclick=connect;await connect()}
async function connect(){const out=document.getElementById('result'),cards=document.getElementById('cards');out.textContent='Testing Planks and T-Beams...';try{const d=await api('/api/connect');out.textContent=JSON.stringify(d,null,2);cards.innerHTML=d.results.map(r=>`<div class="card"><h3>${esc(r.name)}</h3>${badge(r.online)}<div class="meta" style="margin-top:10px">${esc(r.host)}:${r.port}<br>Unit ${r.unitId}<br>${r.online?`Sample: ${esc(r.sample.name)} = ${Number(r.sample.value).toFixed(3)} ${esc(r.sample.units)}`:esc(r.error)}</div></div>`).join('')}catch(e){out.textContent='ERROR: '+e.message}}
async function categoryView(id,category,title){clearInterval(timer);app.innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">${esc(title)}</h2><span class="pill">3 second refresh</span><button class="btn secondary" id="reload">Refresh</button></div>${category==='outputs'?'<div class="lock">Read-only safety mode. Output/control writes are deliberately disabled until every register is verified against the live controller.</div>':''}<div id="sys"></div>`;document.getElementById('reload').onclick=()=>loadCategory(id,category);await loadCategory(id,category);timer=setInterval(()=>loadCategory(id,category),3000)}
async function loadCategory(id,category){const el=document.getElementById('sys');if(!el)return;try{const d=await api(`/api/system/${id}/${category}`);el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><h3 style="margin-top:0">${esc(d.name)}</h3><div class="meta">${esc(d.host)}:${d.port} · Unit ${d.unitId}<br>Read ${d.okCount}/${d.pointCount} points in ${d.elapsedMs} ms</div></div>${badge(d.online)}</div>${d.pointCount?`<table class="points"><thead><tr><th>Point</th><th>Register(s)</th><th>Value</th><th>Notes</th><th>Status</th></tr></thead><tbody>${d.points.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.highRegister!==undefined?`${p.highRegister}/${p.register}`:p.register}</td><td class="value">${p.ok?`${Number(p.value).toFixed(p.kind==='signed32Analog'?3:0)} ${esc(p.units||'')}`:'—'}</td><td class="meta">${esc(p.note||'')}</td><td>${p.ok?'OK':`<span class="error">${esc(p.error)}</span>`}</td></tr>`).join('')}</tbody></table>`:'<p class="meta">No verified points mapped yet for this controller/category.</p>'}</div>`}catch(e){el.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function variablesView(){clearInterval(timer);app.innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">Variables</h2></div><div class="grid"><div id="plankVars"></div><div id="tbeamVars"></div></div>`;loadVars('planks','plankVars');loadVars('tbeams','tbeamVars');timer=setInterval(()=>{loadVars('planks','plankVars');loadVars('tbeams','tbeamVars')},3000)}async function loadVars(id,target){const el=document.getElementById(target);try{const d=await api(`/api/system/${id}/variables`);el.innerHTML=`<div class="card"><h3>${esc(d.name)}</h3>${d.points.length?d.points.map(p=>`<div><b>${esc(p.name)}</b>: ${p.ok?esc(p.value):'—'} <span class="meta">reg ${p.register} ${esc(p.note||'')}</span></div>`).join(''):'<p class="meta">No verified variable register map loaded yet.</p>'}</div>`}catch(e){el.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
function rawView(){clearInterval(timer);app.innerHTML=`<div class="card"><h2>Raw Register Reader</h2><p class="meta">Direct FC03 holding-register read through Render. Maximum 64 registers.</p><div class="toolbar"><select id="system"><option value="planks">Planks</option><option value="tbeams">T-Beams</option></select><input id="reg" type="number" value="7484" min="0" max="65535" style="padding:9px"><input id="qty" type="number" value="2" min="1" max="64" style="padding:9px;width:90px"><button class="btn" id="read">Read</button></div><div class="log" id="rawout">Ready.</div></div>`;document.getElementById('read').onclick=async()=>{const s=system.value,r=reg.value,q=qty.value,o=rawout;o.textContent='Reading...';try{o.textContent=JSON.stringify(await api(`/api/raw/${s}?register=${encodeURIComponent(r)}&quantity=${encodeURIComponent(q)}`),null,2)}catch(e){o.textContent='ERROR: '+e.message}}}
function programsView(){clearInterval(timer);app.innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin-right:auto">Programs</h2><span class="pill">Decoder workspace</span></div><div class="lock">No program writes in v0.5.0. Raw program bytes are preserved exactly while we finish the Temco/Bravo token decoder.</div><div class="split"><div><h3>Raw program hex</h3><textarea id="hex" class="code" rows="18" placeholder="Paste the raw program bytes here, e.g. 1A 02 01 0A ..."></textarea><button class="btn" id="decode">Decode / Inspect</button></div><div><h3>Decoded preview</h3><div class="log" id="decoded">Ready.</div></div></div></div>`;document.getElementById('decode').onclick=async()=>{decoded.textContent='Decoding...';try{const d=await api('/api/program/decode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hex:hex.value})});decoded.textContent=(d.preview||'(no printable strings found)')+'\n\n'+d.note+'\n\nBytes: '+d.byteLength}catch(e){decoded.textContent='ERROR: '+e.message}}}
const views={overview,planksInputs:()=>categoryView('planks','inputs','Planks Inputs'),tbeamsInputs:()=>categoryView('tbeams','inputs','T-Beams Inputs'),planksOutputs:()=>categoryView('planks','outputs','Planks Outputs / Controls'),tbeamsOutputs:()=>categoryView('tbeams','outputs','T-Beams Outputs / Controls'),variables:variablesView,raw:rawView,programs:programsView};document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');views[b.dataset.view]()});overview();
</script></body></html>
